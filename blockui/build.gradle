// Fabric 1.21.11 port of BlockUI (originally NeoForge 1.21.1). The NeoForge build files are kept as *.neoforge.
plugins {
    id 'fabric-loom' version '1.19.4'
}

version = project.mod_version
group = 'com.ldtteam'
base { archivesName = 'blockui-fabric' }

// Folder holding ForgeConfigAPIPort-v21.11.1-mc1.21.11-Fabric.jar (CurseForge / Modrinth). Override with -PlibsDir=<folder>.
def packCache = file(findProperty('libsDir') ?: '../../cache/jars')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Provides NeoForge's ModConfigSpec API on Fabric (same jar the modpack ships)
    modImplementation files("${packCache}/ForgeConfigAPIPort-v21.11.1-mc1.21.11-Fabric.jar")
    // FCAP ships these jar-in-jar; the dev runtime doesn't unpack nested jars of a files() dependency
    runtimeOnly 'com.electronwill.night-config:core:3.8.3'
    runtimeOnly 'com.electronwill.night-config:toml:3.8.3'
    // @Nullable / @Nonnull, which NeoForge's classpath supplied
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

loom {
    accessWidenerPath = file('src/main/resources/blockui.accesswidener')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

jar {
    from('LICENSE') { rename { "${it}_blockui" } }
}
